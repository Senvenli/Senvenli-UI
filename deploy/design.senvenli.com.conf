# nginx site for design.senvenli.com: the static docs site and the hosted MCP endpoint.
# Install: /etc/nginx/sites-available/design.senvenli.com, symlink into sites-enabled, `nginx -t`, reload.
# TLS: `certbot --nginx -d design.senvenli.com` adds the 443 server and the redirect.

# Hosted MCP: per client IP, 2 requests a second with bursts of 20 (an agent session makes a handful per answer).
limit_req_zone $binary_remote_addr zone=senvenli_mcp:10m rate=2r/s;

server {
  listen 80;
  listen [::]:80;
  server_name design.senvenli.com;

  root /var/www/senvenli-design;
  index index.html;

  # Pages are folders with an index.html; no trailing slash, no redirect.
  location / {
    try_files $uri $uri/index.html =404;
  }
  error_page 404 /404.html;

  types {
    text/markdown md;
    text/plain txt;
  }
  charset utf-8;
  charset_types text/markdown text/plain application/json;

  # Hashed build assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Stateless Streamable HTTP; the node service listens on loopback only.
  location = /mcp {
    limit_req zone=senvenli_mcp burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8787/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }
}
